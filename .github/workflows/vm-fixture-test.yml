name: Disposable Android fixture experiment
on:
  workflow_dispatch:
  push:
    branches: [test/android-module-foundation-20261002]
    paths:
      - .github/workflows/vm-fixture-test.yml
      - tools/vm_runner.py
      - tools/vm_validate.py
      - tests/test_vm_scope.py
permissions:
  contents: read
concurrency:
  group: guizang-disposable-fixture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Host safety tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile this commit's read-only probe and permission-free fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vm-preparation-evidence
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          sh tools/build-native-android.sh 2>&1 | tee vm-preparation-evidence/native-build.txt
          sh tools/build-fixture.sh 2>&1 | tee vm-preparation-evidence/fixture-build.txt
          cp build/android/ndk-version.txt vm-preparation-evidence/
          cp build/fixture/build-info.txt vm-preparation-evidence/
          sha256sum build/android/x86_64/guizang-probe build/fixture/guizang-fixture-debug.apk > vm-preparation-evidence/inputs.sha256
          printf '%s\n' "$GITHUB_SHA" > vm-preparation-evidence/source-commit.txt
      - name: Install official API35 image using preaccepted runner licenses
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          # No yes pipe or --licenses: new unaccepted agreements stop this step.
          "$SDKMANAGER" --install 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' < /dev/null 2>&1 | tee vm-preparation-evidence/sdk-preparation.txt
      - name: Run approved disposable fixture and interruption recovery experiment
        run: >-
          python3 tools/vm_runner.py --ack-disposable-vm
          --probe build/android/x86_64/guizang-probe
          --apk build/fixture/guizang-fixture-debug.apk
          --output vm-evidence
      - name: Preserve reports even on unsupported images or failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guizang-disposable-vm-evidence
          path: |
            vm-preparation-evidence/
            vm-evidence/
          if-no-files-found: warn
          retention-days: 14
