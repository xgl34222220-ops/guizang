name: Deploy Project War Room

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build local Supabase client
        run: |
          npm install --no-save @supabase/supabase-js@2.117.2 esbuild@0.28.2
          npx esbuild supabase-entry.js --bundle --format=esm --minify --outfile=supabase-bundle.js
          node --input-type=module -e "import(\"./supabase-bundle.js\").then(m=>{if(typeof m.createClient!==\"function\") process.exit(1)})"
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html supabase-bundle.js _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
