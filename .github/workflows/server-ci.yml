name: Server CI

on:
  push:
    branches: [main]
    paths:
      - server.js
      - package.json
      - Dockerfile
      - docker-compose.yml
      - public/**
      - .github/workflows/server-ci.yml
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build server image
        run: docker build -t guizang-room:test .
