name: Server CI

on:
  push:
    branches: [main, "test/dot-chat-reliability-*"]
    paths:
      - server.js
      - package.json
      - Dockerfile
      - docker-compose.yml
      - public/**
      - tests/**
      - .github/workflows/server-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --check server.js
      - run: npm test

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build server image
        run: docker build -t guizang-room:test .
