services:
  guizang:
    build: .
    container_name: guizang-room
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      BASE_URL: ${BASE_URL:-}
      OWNER_TOKEN: ${OWNER_TOKEN:-}
      MUSE_TOKEN: ${MUSE_TOKEN:-}
      DOTS_TOKEN: ${DOTS_TOKEN:-}
    volumes:
      - guizang_data:/data

volumes:
  guizang_data:
